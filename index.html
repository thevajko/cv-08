<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pexeso</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script type="module"  src="js/main.js" defer></script>
    <script>
        function faktorial(cislo) {
            if (cislo <= 1) {
                return 1;
            } else {
                return cislo * faktorial(cislo - 1);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const button = document.getElementById("button");
            button.addEventListener("click", function() {
                const cisloInput = document.getElementById("cislo");
                const vysledokDiv = document.getElementById("vysledok");
                const cislo = parseInt(cisloInput.value);
                if (!isNaN(cislo) && cislo >= 0) {
                    const vysledok = faktorial(cislo);
                    vysledokDiv.textContent = `Faktorial čísla ${cislo} je ${vysledok}`;
                } else {
                    vysledokDiv.textContent = "Prosím zadajte platné nezáporné číslo.";
                }
            });
        });
    </script>
</head>
<body>
<div>
    <label for="cislo">Cislo: </label>
    <input type="text" id="cislo" name="cislo">
    <button id="button">Vyrataj faktorial</button>
    <div id="vysledok">
        Vysledok
    </div>
</div>

<div id="score">
    <div id="player1">
        Hráč 1:
        <span id="player1_guessed">0</span>
    </div>
    <div id="player2">
        Hráč 2:
        <span id="player2_guessed">0</span>
    </div>
</div>
<div id="board"></div>
<button id="start">Rozdaj karty</button>
</body>
</html>
